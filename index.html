<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Life RPG</title>
  <meta name="description" content="Turn real life into an RPG. Log activities, level up skills, collect drops.">
  <meta name="theme-color" content="#14121a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life RPG">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Life RPG</div>
    <div class="coin-pill"><span class="coin-icon"></span><span id="coin-pill">0</span></div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-action="nav" data-view="home"><span>🛡️</span>Character</button>
    <button data-action="nav" data-view="skills"><span>⚔️</span>Skills</button>
    <button data-action="nav" data-view="collection"><span>🎒</span>Collection</button>
    <button data-action="nav" data-view="settings"><span>⚙️</span>Settings</button>
  </nav>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
