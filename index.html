<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>Life RPG</title>
  <meta name="description" content="Turn real life into an RPG. Log activities, level up skills, collect drops.">
  <meta name="theme-color" content="#0c0e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life RPG">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Inline so it applies on the very first frame, before styles.css or any JS loads:
       no black/white flash, straight into the splash. */
    html, body { background: #0c0e24; }
    #splash {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(circle at 50% 42%, #23285e 0%, #0c0e24 62%);
      transition: opacity 0.9s ease, visibility 0.9s;
    }
    #splash img {
      width: 128px; height: 128px; image-rendering: pixelated;
      filter: drop-shadow(0 0 14px rgba(255, 201, 74, 0.45));
      animation: splash-in 1.3s cubic-bezier(.2, .8, .2, 1) both;
    }
    #splash .splash-title {
      font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 30px; letter-spacing: 0.06em;
      color: #ffc94a; text-shadow: 2px 2px 0 #000;
      animation: splash-in 1.3s 0.45s cubic-bezier(.2, .8, .2, 1) both;
    }
    #splash.out { opacity: 0; visibility: hidden; }
    #splash.out img { transform: scale(1.08); transition: transform 0.9s ease; }
    @keyframes splash-in { from { opacity: 0; transform: scale(0.85) translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .splash-title { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/logo.png" alt="" width="128" height="128">
    <div class="splash-title">Life RPG</div>
  </div>
  <script>
    // Safety net: never leave the splash up if the game fails to start.
    setTimeout(function () { var s = document.getElementById('splash'); if (s) s.classList.add('out'); }, 6000);
  </script>
  <header class="topbar">
    <div class="brand">Life RPG</div>
    <div class="top-pills">
      <button class="streak-pill" id="streak-pill" data-action="nav" data-view="quests" aria-label="Streak"><span id="streak-ic"></span><span id="streak-num">0</span></button>
      <div class="coin-pill"><span class="coin-icon"></span><span id="coin-pill">0</span></div>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-action="nav" data-view="home"><span></span>Character</button>
    <button data-action="nav" data-view="skills"><span></span>Skills</button>
    <button data-action="nav" data-view="quests"><span></span>Quests<i class="tab-dot" id="quest-dot" hidden></i></button>
    <button data-action="nav" data-view="collection"><span></span>Collection</button>
    <button data-action="nav" data-view="settings"><span></span>Settings</button>
  </nav>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
