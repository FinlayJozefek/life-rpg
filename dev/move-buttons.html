<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move button trials</title>
<!-- Dev-only page: designs for the battle move buttons. Not deployed. -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0 0 30px; }
  .ctl { position: sticky; top: 0; z-index: 30; background: #0c0a08; padding: 8px; border-bottom: 1px solid #2a2622; }
  .ctl .row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 440px; margin: 0 auto; }
  .ctl button { padding: 6px 9px; border-radius: 6px; border: 1px solid #4a4540; background: #2a2724; color: #e6dcc4; font: 600 12px var(--body-font); cursor: pointer; }
  .ctl button.on { border-color: #e09a3a; color: #e09a3a; }
  .blurb { max-width: 420px; margin: 6px auto 0; text-align: center; font-size: 12px; color: #a89c86; }
  .phone { position: relative; max-width: 400px; margin: 10px auto; height: 720px; max-height: calc(100vh - 150px); border: 8px solid #000; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
  @media (max-width: 440px) { .phone { border: 0; border-radius: 0; height: calc(100vh - 130px); max-height: none; margin: 0; } }
  .scene { position: relative; flex: 1; min-height: 200px; }
  .scene .d-bg { position: absolute; }
  .scene .foe { position: absolute; right: 18%; top: 14%; }
  .scene .foe canvas { width: 96px; height: 96px; image-rendering: pixelated; }
  .scene .hero { position: absolute; left: 8%; bottom: 8%; }
  .scene .hero img { width: 96px; image-rendering: pixelated; }
  .panel2 { position: relative; padding: 8px 8px 12px; background: rgba(10, 8, 6, 0.96); }
  .tbox { border: 2px solid #c8a24a; border-radius: 4px; background: rgba(12, 10, 8, 0.94); padding: 6px 10px; margin-bottom: 8px; font-size: 14px; color: #f4e6c8; }
  .ico { width: 22px; height: 22px; flex: none; }
  .pips { display: inline-flex; gap: 3px; }
  .pips i { width: 7px; height: 7px; border-radius: 50%; background: #0a0908; border: 1px solid #c8a24a; }
  .pips i.on { background: #ffd84a; box-shadow: 0 0 4px #ffb02e; }
  .strong { font: 700 10px var(--body-font); letter-spacing: 0.5px; color: #0a1a06; background: #8ae07a; padding: 0 5px; border-radius: 2px; }
  button { font-family: var(--body-font); cursor: pointer; }

  /* A. Rune stones */
  .A { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .A .m { position: relative; display: flex; align-items: center; gap: 9px; text-align: left; padding: 9px 10px; min-height: 60px; color: #e6dcc4; border: 2px solid #0a0908; border-radius: 6px 6px 10px 10px;
    background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.08), transparent 60%), var(--noise), #3e3934; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12), inset 0 -4px 0 rgba(0, 0, 0, 0.45), 0 3px 0 #000; }
  .A .m .rune { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #1a1714; box-shadow: inset 0 0 0 2px var(--tc), inset 0 0 10px var(--tc); }
  .A .m b { display: block; font: 400 16px var(--display-font); line-height: 1.1; }
  .A .m small { font-size: 11px; color: #a89c86; }
  .A .m .strong { position: absolute; top: -7px; right: 6px; }
  .A .m.sig { border-color: #8a6a1a; box-shadow: inset 0 0 0 1px #e09a3a, inset 0 -4px 0 rgba(0, 0, 0, 0.45), 0 3px 0 #000; }
  .A .m:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12), 0 1px 0 #000; }
  .A .m.off { opacity: 0.45; }
  .A .bag { grid-column: 1 / -1; min-height: 44px; justify-content: center; }

  /* B. Spell cards */
  .B { display: flex; gap: 6px; justify-content: center; align-items: flex-end; padding-top: 12px; }
  .B .c { position: relative; width: 23%; aspect-ratio: 0.72; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 0 4px 7px; border-radius: 8px; border: 2px solid #0a0908;
    background: linear-gradient(var(--tc) 0 26%, #f0e2c0 26%); color: #2a1a0c; box-shadow: 0 4px 0 #000, inset 0 0 0 2px #fff6dc; transition: transform 0.15s; }
  .B .c:nth-child(1) { transform: rotate(-5deg) translateY(4px); } .B .c:nth-child(2) { transform: rotate(-1.5deg); } .B .c:nth-child(3) { transform: rotate(1.5deg); } .B .c:nth-child(4) { transform: rotate(5deg) translateY(4px); }
  .B .c:hover, .B .c.lift { transform: translateY(-14px) scale(1.05) !important; z-index: 2; }
  .B .c .top { width: 100%; height: 26%; display: grid; place-items: center; }
  .B .c .top .ico { width: 26px; height: 26px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.5)); }
  .B .c b { font: 400 13px var(--display-font); text-align: center; line-height: 1.05; margin-top: 4px; }
  .B .c .pow { font: 700 18px var(--display-font); }
  .B .c small { font-size: 9.5px; color: #6a5030; text-align: center; }
  .B .c.sig { box-shadow: 0 4px 0 #000, inset 0 0 0 2px #ffd84a; }
  .B .c .strong { position: absolute; top: -8px; }
  .B .side { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .B .side button { padding: 6px 14px; border-radius: 999px; border: 2px solid #0a0908; background: #3e3934; color: #e6dcc4; font-weight: 700; }

  /* C. Command wheel */
  .C { position: relative; height: 210px; }
  .C .core { position: absolute; left: 50%; top: 50%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 3px solid #0a0908; background: radial-gradient(circle at 40% 30%, #c8402a, #7a1e16 70%); color: #fbe8d0; box-shadow: 0 0 0 4px #c8a24a, 0 5px 0 4px #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .C .core b { font: 400 18px var(--display-font); }
  .C .core small { font-size: 11px; color: #ffd8c8; }
  .C .orb { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 3px solid #0a0908; background: radial-gradient(circle at 40% 30%, #5a534c, #2a2622 70%); color: #e6dcc4; box-shadow: 0 0 0 2px var(--tc), 0 4px 0 #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; }
  .C .orb b { font: 400 12px var(--display-font); line-height: 1; }
  .C .orb .strong { position: absolute; bottom: -8px; }
  .C .orb.sig { box-shadow: 0 0 0 2px #ffd84a, 0 0 12px #ffb02e, 0 4px 0 #000; }

  /* D. Classic command list */
  .D { display: grid; grid-template-columns: 0.9fr 1.6fr; gap: 8px; }
  .D .win { border: 3px solid #e8dcc0; border-radius: 6px; background: linear-gradient(#2a1c12, #160e08); box-shadow: 0 0 0 2px #000, inset 0 0 0 1px #6a5040; padding: 6px 4px; }
  .D .cmd, .D .row2 { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 6px; background: none; border: 0; color: #e6dcc4; font: 400 16px var(--display-font); text-align: left; border-radius: 3px; }
  .D .cmd.on, .D .row2.on { background: rgba(224, 154, 58, 0.18); color: #ffd84a; }
  .D .cmd.on::before, .D .row2.on::before { content: '▶'; font-size: 11px; animation: cur 0.7s steps(2) infinite; }
  @keyframes cur { 50% { transform: translateX(3px); } }
  .D .row2 { justify-content: space-between; font-size: 15px; }
  .D .row2 span { display: flex; align-items: center; gap: 6px; }
  .D .row2 small { font: 600 11px var(--body-font); color: #a89c86; }
  .D .info { grid-column: 1 / -1; font-size: 12px; color: #c8b896; padding: 4px 8px; border: 2px solid #4a3a2a; border-radius: 4px; background: #120c08; }

  /* E. Weapon plaques with a type gem */
  .E { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .E .m { position: relative; display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 7px 10px 7px 6px; min-height: 58px; color: #e6dcc4; border: 2px solid #0a0908; border-radius: 3px;
    background: linear-gradient(90deg, var(--tc) 0 4px, transparent 4px), linear-gradient(#4a453f, #2c2825); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 3px 0 #000; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); }
  .E .m .gem { grid-row: 1 / 3; width: 34px; height: 34px; justify-self: center; display: grid; place-items: center; transform: rotate(45deg); border: 2px solid #0a0908; background: radial-gradient(circle at 35% 30%, #fff8, var(--tc) 55%, #0008); }
  .E .m .gem .ico { transform: rotate(-45deg); width: 18px; height: 18px; }
  .E .m b { font: 400 15px var(--display-font); line-height: 1.1; }
  .E .m .ln { display: flex; gap: 6px; align-items: center; font-size: 11px; color: #a89c86; }
  .E .m .pow { color: #ffd84a; font-weight: 700; }
  .E .m.sig { background: linear-gradient(90deg, var(--tc) 0 4px, transparent 4px), linear-gradient(#5a4a2a, #2c2418); }
  .E .m .strong { position: absolute; bottom: 5px; right: 16px; }
  .E .pot { grid-column: 1 / -1; clip-path: none; grid-template-columns: 40px 1fr auto; min-height: 44px; }
</style>
</head>
<body>
<div class="ctl"><div class="row" id="pick"></div><div class="blurb" id="blurb"></div></div>
<div class="phone">
  <div class="scene"><div class="d-bg sec-5"></div><div class="foe"><canvas></canvas></div><div class="hero"><img id="hero" alt=""></div></div>
  <div class="panel2"><div class="tbox">What will you do?</div><div id="ui"></div></div>
</div>
<script type="module">
import { mountEnemy } from '../js/dungeon/dart.js';
import { avatarDataUrl } from '../js/sprites2.js';
let save = null; try { save = JSON.parse(localStorage.getItem('liferpg.save.v1')); } catch {}
document.getElementById('hero').src = avatarDataUrl(save ? { head: save.equipped?.head, body: save.equipped?.body, feet: save.equipped?.feet } : {}, 4);
mountEnemy(document.querySelector('.foe canvas'), { id: 'fiend' }, 4);

// damage-type colours and little icons
const T = {
  slashing: ['#c8ccd8', '<path d="M4 20 19 5l1 1L5 21z" fill="#fff"/><path d="M15 4h5v5" stroke="#fff" stroke-width="2" fill="none"/>'],
  bleed: ['#e8435a', '<path d="M12 3c4 6 6 9 6 12a6 6 0 0 1-12 0c0-3 2-6 6-12z" fill="#fff"/>'],
  utility: ['#6ab0ff', '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="#fff"/>'],
  potion: ['#e8435a', '<path d="M9 2h6v2h-1v4l5 8a4 4 0 0 1-3.4 6H8.4A4 4 0 0 1 5 16l5-8V4H9z" fill="#fff"/>'],
};
const ico = (t) => `<svg class="ico" viewBox="0 0 24 24">${T[t][1]}</svg>`;
const MOVES = [
  { name: 'Slash', type: 'slashing', label: 'Slashing', pow: 100 },
  { name: 'Master Slash', type: 'slashing', label: 'Slashing', pow: 210, left: 3, max: 3, strong: true, sig: true },
  { name: 'Parry', type: 'utility', label: 'Block, then counter' },
  { name: 'Lacerate', type: 'bleed', label: 'Slashing + bleed', pow: 60, strong: true },
];
const pips = (m) => (m.max ? `<span class="pips">${Array.from({ length: m.max }, (_, i) => `<i class="${i < m.left ? 'on' : ''}"></i>`).join('')}</span>` : '');
const strong = (m) => (m.strong ? '<span class="strong">STRONG</span>' : '');

const DESIGNS = {
  A: ['Rune stones', 'Each move is a chunky carved stone you press down. A glowing rune circle in the damage-type colour holds its icon. Uses are gold gems, signature moves get a gold rim, and a green STRONG tab appears when it hits a weakness.',
    () => `<div class="A">${MOVES.map((m) => `<button class="m ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]}"><span class="rune">${ico(m.type)}</span><span><b>${m.name}</b><small>${m.pow ? `${m.pow}% · ` : ''}${m.label}</small><br>${pips(m)}</span>${strong(m)}</button>`).join('')}
      <button class="m bag" style="--tc:${T.potion[0]}"><span class="rune" style="width:28px;height:28px">${ico('potion')}</span><b style="font-size:15px">Potions · 3 left</b></button></div>`],
  B: ['Spell cards', 'Your moves are a hand of cards fanned out like a card game. The colour band shows the damage type, with the big number showing how hard it hits. Tapping a card lifts it before it plays. Potions and Flee sit underneath.',
    () => `<div class="B">${MOVES.map((m) => `<button class="c ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]}"><span class="top">${ico(m.type)}</span>${strong(m)}<b>${m.name}</b><span class="pow">${m.pow ? m.pow + '%' : '🛡'}</span><small>${m.label}</small>${pips(m) || '<small>&nbsp;</small>'}</button>`).join('')}</div>
      <div class="side"><button>❤ Potions (3)</button><button>Flee</button></div>`],
  C: ['Command wheel', 'Built for thumbs, like an action game: your main attack is a big red button in the middle, and the special moves orbit around it as round stones ringed in their type colour.',
    () => { const pos = [[18, 22], [82, 22], [18, 78], [82, 78]]; const [main, ...rest] = MOVES;
      return `<div class="C"><button class="core"><b>${main.name}</b><small>${main.pow}% · ${main.label}</small></button>
        ${[...rest, { name: 'Potion', type: 'potion', label: '3 left' }].map((m, i) => `<button class="orb ${m.sig ? 'sig' : ''}" style="left:${pos[i][0]}%;top:${pos[i][1]}%;--tc:${T[m.type][0]}">${ico(m.type)}<b>${m.name}</b>${pips(m) || `<small>${m.pow ? m.pow + '%' : m.label}</small>`}${strong(m)}</button>`).join('')}</div>`; }],
  D: ['Classic command menu', 'The old-school RPG menu: pick Fight, Skills, Items or Flee on the left, and the moves list on the right with a blinking ▶ cursor. A strip underneath explains the move you are pointing at.',
    () => `<div class="D"><div class="win">${['Fight', 'Skills', 'Items', 'Flee'].map((c, i) => `<button class="cmd ${i === 0 ? 'on' : ''}">${c}</button>`).join('')}</div>
      <div class="win">${MOVES.map((m, i) => `<button class="row2 ${i === 1 ? 'on' : ''}"><span>${ico(m.type)}${m.name}</span><small>${m.max ? `${m.left}/${m.max}` : m.pow ? m.pow + '%' : ''}</small></button>`).join('')}</div>
      <div class="info"><b style="color:#ffd84a">Master Slash</b> · 210% Slashing · 3 uses this fight · <span style="color:#8ae07a">Strong against demons!</span></div></div>`],
  E: ['Weapon plaques', 'Forged iron plaques shaped like blade tips, each with a cut gem in the damage-type colour and a coloured edge. The hit strength shows in gold, signature moves are bronze, and the potion bar runs underneath.',
    () => `<div class="E">${MOVES.map((m) => `<button class="m ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]}"><span class="gem">${ico(m.type)}</span><b>${m.name}</b><span class="ln">${m.pow ? `<span class="pow">${m.pow}%</span>` : ''}${m.label} ${pips(m)}</span>${strong(m)}</button>`).join('')}
      <button class="m pot" style="--tc:${T.potion[0]}"><span class="gem">${ico('potion')}</span><b>Potions</b><span class="ln" style="grid-row:1 / 3;grid-column:3">3 left this fight</span></button></div>`],
};
let cur = 'A';
const pick = document.getElementById('pick');
function draw() {
  pick.innerHTML = Object.entries(DESIGNS).map(([k, [n]]) => `<button class="${k === cur ? 'on' : ''}" data-k="${k}">${k} · ${n}</button>`).join('');
  document.getElementById('ui').innerHTML = DESIGNS[cur][2]();
  document.getElementById('blurb').textContent = DESIGNS[cur][1];
}
pick.onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) { cur = b.dataset.k; draw(); } };
document.getElementById('ui').addEventListener('click', (e) => { const c = e.target.closest('.B .c'); if (c) { document.querySelectorAll('.B .c').forEach((x) => x.classList.toggle('lift', x === c && !x.classList.contains('lift'))); } });
draw();
</script>
</body>
</html>
