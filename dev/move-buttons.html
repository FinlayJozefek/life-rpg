<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move button trials</title>
<!-- Dev-only page: designs for the battle move buttons. Not deployed. -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 0 0 30px; }
  .ctl { position: sticky; top: 0; z-index: 30; background: #0c0a08; padding: 8px; border-bottom: 1px solid #2a2622; }
  .ctl .row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 440px; margin: 0 auto; }
  .ctl button { padding: 6px 9px; border-radius: 6px; border: 1px solid #4a4540; background: #2a2724; color: #e6dcc4; font: 600 12px var(--body-font); cursor: pointer; }
  .ctl button.on { border-color: #e09a3a; color: #e09a3a; }
  .blurb { max-width: 420px; margin: 6px auto 0; text-align: center; font-size: 12px; color: #a89c86; }
  .phone { position: relative; max-width: 400px; margin: 10px auto; height: 780px; max-height: none; border: 8px solid #000; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
  @media (max-width: 440px) { .phone { border: 0; border-radius: 0; height: calc(100vh - 130px); max-height: none; margin: 0; } }
  .scene { position: relative; flex: 1; min-height: 200px; }
  .scene .d-bg { position: absolute; }
  .scene .foe { position: absolute; right: 18%; top: 14%; }
  .scene .foe canvas { width: 96px; height: 96px; image-rendering: pixelated; }
  .scene .hero { position: absolute; left: 8%; bottom: 8%; }
  .scene .hero img { width: 96px; image-rendering: pixelated; }
  .panel2 { position: relative; padding: 8px 8px 12px; background: rgba(10, 8, 6, 0.96); }
  .tbox { border: 2px solid #c8a24a; border-radius: 4px; background: rgba(12, 10, 8, 0.94); padding: 6px 10px; margin-bottom: 8px; font-size: 14px; color: #f4e6c8; }
  .ico { width: 22px; height: 22px; flex: none; }
  .pips { display: inline-flex; gap: 3px; }
  .pips i { width: 7px; height: 7px; border-radius: 50%; background: #0a0908; border: 1px solid #c8a24a; }
  .pips i.on { background: #ffd84a; box-shadow: 0 0 4px #ffb02e; }
  .strong { font: 700 10px var(--body-font); letter-spacing: 0.5px; color: #0a1a06; background: #8ae07a; padding: 0 5px; border-radius: 2px; }
  button { font-family: var(--body-font); cursor: pointer; }

  /* A. Rune stones */
  .A { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .A .m { position: relative; display: flex; align-items: center; gap: 9px; text-align: left; padding: 9px 10px; min-height: 60px; color: #e6dcc4; border: 2px solid #0a0908; border-radius: 6px 6px 10px 10px;
    background: radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.08), transparent 60%), var(--noise), #3e3934; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12), inset 0 -4px 0 rgba(0, 0, 0, 0.45), 0 3px 0 #000; }
  .A .m .rune { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #1a1714; box-shadow: inset 0 0 0 2px var(--tc), inset 0 0 10px var(--tc); }
  .A .m b { display: block; font: 400 16px var(--display-font); line-height: 1.1; }
  .A .m small { font-size: 11px; color: #a89c86; }
  .A .m .strong { position: absolute; top: -7px; right: 6px; }
  .A .m.sig { border-color: #8a6a1a; box-shadow: inset 0 0 0 1px #e09a3a, inset 0 -4px 0 rgba(0, 0, 0, 0.45), 0 3px 0 #000; }
  .A .m:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.12), 0 1px 0 #000; }
  .A .m.off { opacity: 0.45; }
  .A .bag { grid-column: 1 / -1; min-height: 44px; justify-content: center; }

  /* B. Spell cards */
  .B { display: flex; gap: 6px; justify-content: center; align-items: flex-end; padding-top: 12px; }
  .B .c { position: relative; width: 23%; aspect-ratio: 0.72; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 0 4px 7px; border-radius: 8px; border: 2px solid #0a0908;
    background: linear-gradient(var(--tc) 0 26%, #f0e2c0 26%); color: #2a1a0c; box-shadow: 0 4px 0 #000, inset 0 0 0 2px #fff6dc; transition: transform 0.15s; }
  .B .c:nth-child(1) { transform: rotate(-5deg) translateY(4px); } .B .c:nth-child(2) { transform: rotate(-1.5deg); } .B .c:nth-child(3) { transform: rotate(1.5deg); } .B .c:nth-child(4) { transform: rotate(5deg) translateY(4px); }
  .B .c:hover, .B .c.lift { transform: translateY(-14px) scale(1.05) !important; z-index: 2; }
  .B .c .top { width: 100%; height: 26%; display: grid; place-items: center; }
  .B .c .top .ico { width: 26px; height: 26px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.5)); }
  .B .c b { font: 400 13px var(--display-font); text-align: center; line-height: 1.05; margin-top: 4px; }
  .B .c .pow { font: 700 18px var(--display-font); }
  .B .c small { font-size: 9.5px; color: #6a5030; text-align: center; }
  .B .c.sig { box-shadow: 0 4px 0 #000, inset 0 0 0 2px #ffd84a; }
  .B .c .strong { position: absolute; top: -8px; }
  .B .side { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .B .side button { padding: 6px 14px; border-radius: 999px; border: 2px solid #0a0908; background: #3e3934; color: #e6dcc4; font-weight: 700; }

  /* C. Command wheel */
  .C { position: relative; height: 210px; }
  .C .core { position: absolute; left: 50%; top: 50%; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 3px solid #0a0908; background: radial-gradient(circle at 40% 30%, #c8402a, #7a1e16 70%); color: #fbe8d0; box-shadow: 0 0 0 4px #c8a24a, 0 5px 0 4px #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .C .core b { font: 400 18px var(--display-font); }
  .C .core small { font-size: 11px; color: #ffd8c8; }
  .C .orb { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 3px solid #0a0908; background: radial-gradient(circle at 40% 30%, #5a534c, #2a2622 70%); color: #e6dcc4; box-shadow: 0 0 0 2px var(--tc), 0 4px 0 #000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; }
  .C .orb b { font: 400 12px var(--display-font); line-height: 1; }
  .C .orb .strong { position: absolute; bottom: -8px; }
  .C .orb.sig { box-shadow: 0 0 0 2px #ffd84a, 0 0 12px #ffb02e, 0 4px 0 #000; }

  /* D. Classic command list */
  .D { display: grid; grid-template-columns: 0.9fr 1.6fr; gap: 8px; }
  .D .win { border: 3px solid #e8dcc0; border-radius: 6px; background: linear-gradient(#2a1c12, #160e08); box-shadow: 0 0 0 2px #000, inset 0 0 0 1px #6a5040; padding: 6px 4px; }
  .D .cmd, .D .row2 { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 6px; background: none; border: 0; color: #e6dcc4; font: 400 16px var(--display-font); text-align: left; border-radius: 3px; }
  .D .cmd.on, .D .row2.on { background: rgba(224, 154, 58, 0.18); color: #ffd84a; }
  .D .cmd.on::before, .D .row2.on::before { content: '▶'; font-size: 11px; animation: cur 0.7s steps(2) infinite; }
  @keyframes cur { 50% { transform: translateX(3px); } }
  .D .row2 { justify-content: space-between; font-size: 15px; }
  .D .row2 span { display: flex; align-items: center; gap: 6px; }
  .D .row2 small { font: 600 11px var(--body-font); color: #a89c86; }
  .D .info { grid-column: 1 / -1; font-size: 12px; color: #c8b896; padding: 4px 8px; border: 2px solid #4a3a2a; border-radius: 4px; background: #120c08; }

  /* E. Weapon plaques with a type gem */
  .E { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .E .m { position: relative; display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; text-align: left; padding: 7px 10px 7px 6px; min-height: 58px; color: #e6dcc4; border: 2px solid #0a0908; border-radius: 3px;
    background: linear-gradient(90deg, var(--tc) 0 4px, transparent 4px), linear-gradient(#4a453f, #2c2825); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 3px 0 #000; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); }
  .E .m .gem { grid-row: 1 / 3; width: 34px; height: 34px; justify-self: center; display: grid; place-items: center; transform: rotate(45deg); border: 2px solid #0a0908; background: radial-gradient(circle at 35% 30%, #fff8, var(--tc) 55%, #0008); }
  .E .m .gem .ico { transform: rotate(-45deg); width: 18px; height: 18px; }
  .E .m b { font: 400 15px var(--display-font); line-height: 1.1; }
  .E .m .ln { display: flex; gap: 6px; align-items: center; font-size: 11px; color: #a89c86; }
  .E .m .pow { color: #ffd84a; font-weight: 700; }
  .E .m.sig { background: linear-gradient(90deg, var(--tc) 0 4px, transparent 4px), linear-gradient(#5a4a2a, #2c2418); }
  .E .m .strong { position: absolute; bottom: 5px; right: 16px; }
  .E .pot { grid-column: 1 / -1; clip-path: none; grid-template-columns: 40px 1fr auto; min-height: 44px; }

  /* ---------- shared card behaviour ---------- */
  .hand { position: relative; display: flex; justify-content: center; align-items: flex-end; height: 196px; padding-top: 14px; }
  .card { position: relative; flex: none; width: 112px; height: 166px; margin: 0 -14px; padding: 0; border: 0; background: none; cursor: pointer; transform-origin: 50% 120%;
    transition: transform 0.18s, filter 0.18s; animation: deal 0.5s backwards cubic-bezier(.2, .8, .2, 1); }
  .card:nth-child(1) { --r: -9deg; --y: 10px; animation-delay: 0.05s; } .card:nth-child(2) { --r: -3deg; --y: 0px; animation-delay: 0.15s; }
  .card:nth-child(3) { --r: 3deg; --y: 0px; animation-delay: 0.25s; } .card:nth-child(4) { --r: 9deg; --y: 10px; animation-delay: 0.35s; }
  .card { transform: rotate(var(--r)) translateY(var(--y)); }
  .card.lift { transform: rotate(0deg) translateY(-26px) scale(1.12); z-index: 5; filter: drop-shadow(0 0 10px var(--glow, #ffd84a)); }
  .card.play { animation: play 0.55s forwards cubic-bezier(.5, 0, .7, .3); z-index: 6; }
  @keyframes deal { from { transform: translate(-160px, 60px) rotate(-40deg) scale(0.6); opacity: 0; } }
  @keyframes play { 0% { transform: translateY(-26px) scale(1.12); } 60% { transform: translate(60px, -330px) scale(0.7) rotate(18deg); opacity: 1; filter: brightness(2) drop-shadow(0 0 16px #fff); } 100% { transform: translate(70px, -360px) scale(0.2); opacity: 0; } }
  .foe.struck canvas { animation: struck 0.35s; }
  @keyframes struck { 0%, 40% { filter: brightness(4) saturate(0); transform: translateX(6px); } 100% { filter: none; transform: none; } }
  .hint2 { text-align: center; font-size: 11px; color: #a89c86; margin-top: 2px; }
  .under { display: flex; justify-content: center; gap: 8px; margin-top: 4px; }
  .under button { padding: 6px 14px; border-radius: 999px; border: 2px solid #0a0908; background: #3e3934; color: #e6dcc4; font-weight: 700; font-size: 13px; }

  /* K1 tarot: parchment with a gilded frame, arched art window, name ribbon and a wax-seal power badge */
  .k1 .face { position: absolute; inset: 0; border-radius: 7px; background: var(--noise), #efe0bc; border: 2px solid #3a2410; box-shadow: inset 0 0 0 3px #efe0bc, inset 0 0 0 4px #b8862a, inset 0 0 0 6px #efe0bc, inset 0 0 0 7px #6a4a1a, 0 4px 0 #000; }
  .k1 .art { position: absolute; left: 12px; right: 12px; top: 12px; height: 74px; border-radius: 40px 40px 4px 4px; border: 2px solid #6a4a1a; display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--tc) 55%, transparent), transparent 70%), linear-gradient(#2a1c12, #4a3420); }
  .k1 .art img { width: 70px; image-rendering: pixelated; filter: drop-shadow(0 2px 0 #000); }
  .k1 .art .ico { width: 34px; height: 34px; }
  .k1 .ribbon { position: absolute; left: 4px; right: 4px; top: 82px; padding: 3px 0; background: #7a1e16; color: #fbe8d0; font: 400 12px var(--display-font); text-align: center; clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); }
  .k1 .txt { position: absolute; left: 10px; right: 10px; top: 106px; font-size: 10.5px; line-height: 1.2; color: #4a3420; text-align: center; }
  .k1 .seal { position: absolute; left: 8px; bottom: 6px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 40% 35%, #c8402a, #7a1410 70%); color: #fbe8d0; font: 400 11px var(--display-font); box-shadow: 0 2px 0 #3a0a06; }
  .k1 .uses { position: absolute; left: 46px; bottom: 18px; }
  .k1 .strong { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); }
  .k1.sig .face { box-shadow: inset 0 0 0 3px #efe0bc, inset 0 0 0 4px #ffd84a, inset 0 0 0 6px #efe0bc, inset 0 0 0 7px #b8862a, 0 4px 0 #000, 0 0 12px rgba(255, 216, 74, 0.5); }

  /* K2 dark foil: black card, shimmering foil edge in the type colour, glowing sigil */
  .k2 .face { position: absolute; inset: 0; border-radius: 9px; padding: 3px; background: linear-gradient(120deg, var(--tc), #fff 40%, var(--tc) 55%, #222 80%, var(--tc)); background-size: 300% 300%; animation: foil 3s linear infinite; box-shadow: 0 4px 0 #000; }
  @keyframes foil { to { background-position: 300% 300%; } }
  .k2 .in { position: absolute; inset: 3px; border-radius: 7px; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--tc) 35%, transparent), transparent 55%), #0e0c12; display: flex; flex-direction: column; align-items: center; padding: 8px 6px; color: #f0e8ff; }
  .k2 .sig2 { width: 62px; height: 62px; margin-top: 6px; display: grid; place-items: center; border-radius: 50%; border: 1px solid color-mix(in srgb, var(--tc) 60%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--tc) 60%, transparent), inset 0 0 12px color-mix(in srgb, var(--tc) 50%, transparent); }
  .k2 .sig2 .ico { width: 32px; height: 32px; filter: drop-shadow(0 0 6px var(--tc)); }
  .k2 b { font: 400 13px var(--display-font); margin-top: 8px; text-align: center; line-height: 1.05; }
  .k2 .p { font: 400 20px var(--display-font); color: var(--tc); text-shadow: 0 0 8px var(--tc); }
  .k2 small { font-size: 9.5px; color: #a8a0c0; }
  .k2.sig .in::after { content: ''; position: absolute; inset: 0; border-radius: 7px; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.35) 45%, rgba(160, 120, 255, 0.25) 52%, transparent 65%); background-size: 250% 100%; animation: holo 2.2s ease-in-out infinite; mix-blend-mode: screen; }
  @keyframes holo { from { background-position: 150% 0; } to { background-position: -100% 0; } }
  .k2 .strong { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); }

  /* K3 pixel trading card: stepped pixel frame, a mini battle scene as the art, stat bar */
  .k3 .face { position: absolute; inset: 0; background: var(--tc); clip-path: polygon(0 6px, 6px 6px, 6px 0, calc(100% - 6px) 0, calc(100% - 6px) 6px, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 6px calc(100% - 6px), 0 calc(100% - 6px)); }
  .k3 .in { position: absolute; inset: 5px; background: #f4e6c4; clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px)); padding: 5px; color: #2a1a0c; text-align: left; }
  .k3 .hd { display: flex; justify-content: space-between; align-items: center; font: 700 11px var(--body-font); }
  .k3 .badge { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--tc); border: 2px solid #2a1a0c; }
  .k3 .badge .ico { width: 12px; height: 12px; }
  .k3 .art { height: 62px; margin: 4px 0; border: 2px solid #2a1a0c; display: grid; place-items: center; position: relative; overflow: hidden; background: linear-gradient(#3a0a06, #8a2a12 70%, #2a0a06 70%); image-rendering: pixelated; }
  .k3 .art img { width: 56px; image-rendering: pixelated; }
  .k3 .art::after { content: ''; position: absolute; width: 90px; height: 4px; background: #fff; transform: rotate(-35deg); box-shadow: 0 0 6px #fff; opacity: 0.85; }
  .k3 .art.util::after { display: none; }
  .k3 .stat { display: flex; justify-content: space-between; font: 700 10px var(--body-font); border-top: 2px dotted #8a6a3a; padding-top: 3px; }
  .k3 .stat span:first-child { font-size: 15px; font-family: var(--display-font); font-weight: 400; }
  .k3 .desc { font-size: 9.5px; line-height: 1.15; color: #5a4028; margin-top: 2px; }
  .k3 .strong { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); }

  /* K4 stone tablets: rune stones as cards, the rune flares when lifted */
  .k4 .face { position: absolute; inset: 0; border-radius: 10px 10px 6px 6px; border: 2px solid #0a0908; background: radial-gradient(circle at 30% 18%, rgba(255, 255, 255, 0.08), transparent 55%), var(--noise), #3e3934;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.14), inset 0 -5px 0 rgba(0, 0, 0, 0.45), 0 4px 0 #000; display: flex; flex-direction: column; align-items: center; padding: 10px 6px; color: #e6dcc4; }
  .k4 .rune { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: #1a1714; box-shadow: inset 0 0 0 2px var(--tc), inset 0 0 12px var(--tc); transition: box-shadow 0.2s; }
  .k4 .rune .ico { width: 30px; height: 30px; }
  .k4.lift .rune { box-shadow: inset 0 0 0 2px var(--tc), inset 0 0 22px var(--tc), 0 0 22px var(--tc); }
  .k4 b { font: 400 14px var(--display-font); margin-top: 8px; text-align: center; line-height: 1.05; }
  .k4 small { font-size: 10px; color: #a89c86; text-align: center; }
  .k4 .crack { position: absolute; left: 14px; bottom: 22px; width: 30px; height: 2px; background: #1a1714; transform: rotate(-20deg); }
  .k4.sig .face { border-color: #8a6a1a; box-shadow: inset 0 0 0 1px #e09a3a, inset 0 -5px 0 rgba(0, 0, 0, 0.45), 0 4px 0 #000; }
  .k4 .strong { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); }

  /* K5 the deck: cards flip over from a deck pile when your turn starts */
  .deck { position: absolute; left: 4px; bottom: 16px; width: 44px; height: 64px; border-radius: 5px; border: 2px solid #0a0908; background: repeating-linear-gradient(45deg, #5a1a14 0 6px, #3a0e0a 6px 12px); box-shadow: 2px 2px 0 #000, 4px 4px 0 #2a0a06, 6px 6px 0 #000; }
  .deck::after { content: '3'; position: absolute; right: -6px; top: -8px; width: 18px; height: 18px; border-radius: 50%; background: #e09a3a; color: #000; font: 700 11px var(--body-font); display: grid; place-items: center; }
  .k5 { perspective: 600px; }
  .card.k5:nth-child(2) { --r: -9deg; --y: 10px; } .card.k5:nth-child(3) { --r: -3deg; --y: 0px; } .card.k5:nth-child(4) { --r: 3deg; --y: 0px; } .card.k5:nth-child(5) { --r: 9deg; --y: 10px; }
  .k5 .flipper { position: absolute; inset: 0; transform-style: preserve-3d; animation: flipin 0.7s backwards; }
  .k5:nth-child(2) .flipper { animation-delay: 0.1s; } .k5:nth-child(3) .flipper { animation-delay: 0.25s; } .k5:nth-child(4) .flipper { animation-delay: 0.4s; } .k5:nth-child(5) .flipper { animation-delay: 0.55s; }
  @keyframes flipin { 0% { transform: rotateY(180deg); } 100% { transform: rotateY(0deg); } }
  .k5 .front, .k5 .back { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; border: 2px solid #0a0908; }
  .k5 .back { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, #5a1a14 0 6px, #3a0e0a 6px 12px); }
  .k5 .front { background: linear-gradient(var(--tc) 0 30%, #f0e2c0 30%); display: flex; flex-direction: column; align-items: center; padding: 8px 4px; color: #2a1a0c; box-shadow: 0 4px 0 #000, inset 0 0 0 2px #fff6dc; }
  .k5 .front .ico { width: 30px; height: 30px; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, 0.5)); }
  .k5 .front b { font: 400 13px var(--display-font); margin-top: 18px; text-align: center; line-height: 1.05; }
  .k5 .front .p { font: 400 20px var(--display-font); }
  .k5 .front small { font-size: 9.5px; color: #6a5030; text-align: center; }
  .k5 .strong { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); z-index: 2; }
</style>
</head>
<body>
<div class="ctl"><div class="row" id="pick"></div><div class="blurb" id="blurb"></div></div>
<div class="phone">
  <div class="scene"><div class="d-bg sec-5"></div><div class="foe"><canvas></canvas></div><div class="hero"><img id="hero" alt=""></div></div>
  <div class="panel2"><div class="tbox">What will you do?</div><div id="ui"></div></div>
</div>
<script type="module">
import { mountEnemy } from '../js/dungeon/dart.js';
import { avatarDataUrl } from '../js/sprites2.js';
import { gearArtIcon } from '../js/dungeon/gearart.js';
import { DITEMS } from '../js/dungeon/ddata.js';
let save = null; try { save = JSON.parse(localStorage.getItem('liferpg.save.v1')); } catch {}
document.getElementById('hero').src = avatarDataUrl(save ? { head: save.equipped?.head, body: save.equipped?.body, feet: save.equipped?.feet } : {}, 4);
mountEnemy(document.querySelector('.foe canvas'), { id: 'fiend' }, 4);
const wId = save?.dungeon?.equipped?.weapon && DITEMS[save.dungeon.equipped.weapon] ? save.dungeon.equipped.weapon : 'd5.demonbane-blade';
const wArt = gearArtIcon(DITEMS[wId], 3);
const art = (m) => (m.type === 'utility' ? ico('utility') : `<img src="${wArt}" alt="">`);

// damage-type colours and little icons
const T = {
  slashing: ['#c8ccd8', '<path d="M4 20 19 5l1 1L5 21z" fill="#fff"/><path d="M15 4h5v5" stroke="#fff" stroke-width="2" fill="none"/>'],
  bleed: ['#e8435a', '<path d="M12 3c4 6 6 9 6 12a6 6 0 0 1-12 0c0-3 2-6 6-12z" fill="#fff"/>'],
  utility: ['#6ab0ff', '<path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="#fff"/>'],
  potion: ['#e8435a', '<path d="M9 2h6v2h-1v4l5 8a4 4 0 0 1-3.4 6H8.4A4 4 0 0 1 5 16l5-8V4H9z" fill="#fff"/>'],
};
const ico = (t) => `<svg class="ico" viewBox="0 0 24 24">${T[t][1]}</svg>`;
const MOVES = [
  { name: 'Slash', type: 'slashing', label: 'Slashing', pow: 100 },
  { name: 'Master Slash', type: 'slashing', label: 'Slashing', pow: 210, left: 3, max: 3, strong: true, sig: true },
  { name: 'Parry', type: 'utility', label: 'Block, then counter' },
  { name: 'Lacerate', type: 'bleed', label: 'Slashing + bleed', pow: 60, strong: true },
];
const pips = (m) => (m.max ? `<span class="pips">${Array.from({ length: m.max }, (_, i) => `<i class="${i < m.left ? 'on' : ''}"></i>`).join('')}</span>` : '');
const strong = (m) => (m.strong ? '<span class="strong">STRONG</span>' : '');

const DESIGNS = {
  A: ['Rune stones', 'Each move is a chunky carved stone you press down. A glowing rune circle in the damage-type colour holds its icon. Uses are gold gems, signature moves get a gold rim, and a green STRONG tab appears when it hits a weakness.',
    () => `<div class="A">${MOVES.map((m) => `<button class="m ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]}"><span class="rune">${ico(m.type)}</span><span><b>${m.name}</b><small>${m.pow ? `${m.pow}% · ` : ''}${m.label}</small><br>${pips(m)}</span>${strong(m)}</button>`).join('')}
      <button class="m bag" style="--tc:${T.potion[0]}"><span class="rune" style="width:28px;height:28px">${ico('potion')}</span><b style="font-size:15px">Potions · 3 left</b></button></div>`],
  B: ['Cards · Simple', 'Your moves are a hand of cards fanned out like a card game. The colour band shows the damage type, with the big number showing how hard it hits. Tapping a card lifts it before it plays. Potions and Flee sit underneath.',
    () => `<div class="B">${MOVES.map((m) => `<button class="c ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]}"><span class="top">${ico(m.type)}</span>${strong(m)}<b>${m.name}</b><span class="pow">${m.pow ? m.pow + '%' : '🛡'}</span><small>${m.label}</small>${pips(m) || '<small>&nbsp;</small>'}</button>`).join('')}</div>
      <div class="side"><button>❤ Potions (3)</button><button>Flee</button></div>`],

  K1: ['Cards · Tarot', 'Old fortune-teller cards: aged parchment with a gilded double frame, an arched window showing your actual weapon, a red name ribbon and a wax seal with the hit strength. Signature moves get a gold glow. Tap a card to lift it, tap again to play it at the enemy.',
    () => `<div class="hand">${MOVES.map((m) => `<button class="card k1 ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]}"><span class="face"></span><span class="art">${art(m)}</span><span class="ribbon">${m.name}</span><span class="txt">${m.label}</span><span class="uses">${pips(m)}</span><span class="seal">${m.pow ? m.pow + '%' : 'DEF'}</span>${strong(m)}</button>`).join('')}</div>
      <div class="under"><button>❤ Potions (3)</button><button>Flee</button></div><div class="hint2">tap to lift · tap again to play</div>`],
  K2: ['Cards · Dark foil', 'Black collector cards with a foil edge that shimmers in the damage-type colour and a glowing sigil in the middle. Signature moves are holographic, with a rainbow sheen sweeping across.',
    () => `<div class="hand">${MOVES.map((m) => `<button class="card k2 ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]};--glow:${T[m.type][0]}"><span class="face"></span><span class="in"><span class="sig2">${ico(m.type)}</span><b>${m.name}</b><span class="p">${m.pow ? m.pow + '%' : '—'}</span><small>${m.label}</small>${pips(m)}</span>${strong(m)}</button>`).join('')}</div>
      <div class="under"><button>❤ Potions (3)</button><button>Flee</button></div><div class="hint2">tap to lift · tap again to play</div>`],
  K3: ['Cards · Pixel trading card', 'Like a collectible monster card: a stepped pixel frame in the damage-type colour, a type badge, a mini battle picture with your weapon mid-swing, a strength stat and a line of rules text.',
    () => `<div class="hand">${MOVES.map((m) => `<button class="card k3" style="--tc:${T[m.type][0]}"><span class="face"></span><span class="in"><span class="hd">${m.name}<span class="badge">${ico(m.type)}</span></span><span class="art ${m.type === 'utility' ? 'util' : ''}">${art(m)}</span><span class="stat"><span>${m.pow ? m.pow + '%' : 'DEF'}</span>${pips(m) || '<span>∞</span>'}</span><span class="desc">${m.label}</span></span>${strong(m)}</button>`).join('')}</div>
      <div class="under"><button>❤ Potions (3)</button><button>Flee</button></div><div class="hint2">tap to lift · tap again to play</div>`],
  K4: ['Cards · Stone tablets', 'Your rune stones made into a hand of carved tablets. Lifting one makes its rune flare up in the damage-type colour, so it mixes the card hand with the stones you liked.',
    () => `<div class="hand">${MOVES.map((m) => `<button class="card k4 ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]};--glow:${T[m.type][0]}"><span class="face"><span class="rune">${ico(m.type)}</span><b>${m.name}</b><small>${m.pow ? m.pow + '% · ' : ''}${m.label}</small>${pips(m)}<span class="crack"></span></span>${strong(m)}</button>`).join('')}</div>
      <div class="under"><button>❤ Potions (3)</button><button>Flee</button></div><div class="hint2">tap to lift · tap again to play</div>`],
  K5: ['Cards · Deck draw', 'Each turn your hand flips over one card at a time from a deck in the corner, like drawing in a card game. A played card flies at the enemy and burns up. The number on the deck is your potions.',
    () => `<div class="hand"><span class="deck"></span>${MOVES.map((m) => `<button class="card k5" style="--tc:${T[m.type][0]}"><span class="flipper"><span class="front">${ico(m.type)}<b>${m.name}</b><span class="p">${m.pow ? m.pow + '%' : '🛡'}</span><small>${m.label}</small>${pips(m)}</span><span class="back"></span></span>${strong(m)}</button>`).join('')}</div>
      <div class="under"><button>❤ Potions (3)</button><button>Flee</button></div><div class="hint2">tap to lift · tap again to play</div>`],
  C: ['Command wheel', 'Built for thumbs, like an action game: your main attack is a big red button in the middle, and the special moves orbit around it as round stones ringed in their type colour.',
    () => { const pos = [[18, 22], [82, 22], [18, 78], [82, 78]]; const [main, ...rest] = MOVES;
      return `<div class="C"><button class="core"><b>${main.name}</b><small>${main.pow}% · ${main.label}</small></button>
        ${[...rest, { name: 'Potion', type: 'potion', label: '3 left' }].map((m, i) => `<button class="orb ${m.sig ? 'sig' : ''}" style="left:${pos[i][0]}%;top:${pos[i][1]}%;--tc:${T[m.type][0]}">${ico(m.type)}<b>${m.name}</b>${pips(m) || `<small>${m.pow ? m.pow + '%' : m.label}</small>`}${strong(m)}</button>`).join('')}</div>`; }],
  D: ['Classic command menu', 'The old-school RPG menu: pick Fight, Skills, Items or Flee on the left, and the moves list on the right with a blinking ▶ cursor. A strip underneath explains the move you are pointing at.',
    () => `<div class="D"><div class="win">${['Fight', 'Skills', 'Items', 'Flee'].map((c, i) => `<button class="cmd ${i === 0 ? 'on' : ''}">${c}</button>`).join('')}</div>
      <div class="win">${MOVES.map((m, i) => `<button class="row2 ${i === 1 ? 'on' : ''}"><span>${ico(m.type)}${m.name}</span><small>${m.max ? `${m.left}/${m.max}` : m.pow ? m.pow + '%' : ''}</small></button>`).join('')}</div>
      <div class="info"><b style="color:#ffd84a">Master Slash</b> · 210% Slashing · 3 uses this fight · <span style="color:#8ae07a">Strong against demons!</span></div></div>`],
  E: ['Weapon plaques', 'Forged iron plaques shaped like blade tips, each with a cut gem in the damage-type colour and a coloured edge. The hit strength shows in gold, signature moves are bronze, and the potion bar runs underneath.',
    () => `<div class="E">${MOVES.map((m) => `<button class="m ${m.sig ? 'sig' : ''}" style="--tc:${T[m.type][0]}"><span class="gem">${ico(m.type)}</span><b>${m.name}</b><span class="ln">${m.pow ? `<span class="pow">${m.pow}%</span>` : ''}${m.label} ${pips(m)}</span>${strong(m)}</button>`).join('')}
      <button class="m pot" style="--tc:${T.potion[0]}"><span class="gem">${ico('potion')}</span><b>Potions</b><span class="ln" style="grid-row:1 / 3;grid-column:3">3 left this fight</span></button></div>`],
};
let cur = 'A';
const pick = document.getElementById('pick');
function draw() {
  pick.innerHTML = Object.entries(DESIGNS).map(([k, [n]]) => `<button class="${k === cur ? 'on' : ''}" data-k="${k}">${k} · ${n}</button>`).join('');
  document.getElementById('ui').innerHTML = DESIGNS[cur][2]();
  document.getElementById('blurb').textContent = DESIGNS[cur][1];
}
pick.onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) { cur = b.dataset.k; draw(); } };
document.getElementById('ui').addEventListener('click', (e) => {
  const c = e.target.closest('.B .c'); if (c) { document.querySelectorAll('.B .c').forEach((x) => x.classList.toggle('lift', x === c && !x.classList.contains('lift'))); return; }
  const k = e.target.closest('.card'); if (!k) return;
  if (!k.classList.contains('lift')) { document.querySelectorAll('.card').forEach((x) => x.classList.toggle('lift', x === k)); return; }
  k.classList.remove('lift'); k.classList.add('play');
  setTimeout(() => { const f = document.querySelector('.foe'); f.classList.remove('struck'); void f.offsetWidth; f.classList.add('struck'); }, 330);
  setTimeout(draw, 1100);
});
draw();
</script>
</body>
</html>
