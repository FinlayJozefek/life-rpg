<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon hub looks</title>
<!-- Dev-only page: trial layouts for the Dungeon main screen. Not deployed. -->
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding-bottom: 30px; }
  main { max-width: 420px; padding-left: 0; padding-right: 0; }
  .picker { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .picker .row { display: flex; gap: 6px; }
  .picker button { flex: 1; padding: 8px 4px; border: 2px solid var(--line); background: var(--panel); color: var(--muted); font: 700 12px var(--display-font); border-radius: 8px; }
  .picker button.on { border-color: var(--gold); color: var(--gold); background: var(--gold-bg); }
  .picker .sim { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .picker input { flex: 1; accent-color: #ffc94a; }
  .blurb { font-size: 12px; color: var(--muted); padding: 8px 14px 0; }
  .px { image-rendering: pixelated; }

  /* ---------- shared compact header ---------- */
  .hud { display: flex; align-items: center; gap: 10px; margin: 10px 12px; padding: 8px 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; }
  .hud .lv { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) var(--p), var(--deep) 0); position: relative; flex: none; }
  .hud .lv b { position: absolute; inset: 4px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font: 700 17px var(--display-font); color: var(--gold); }
  .hud .mid { flex: 1; min-width: 0; line-height: 1.25; }
  .hud .mid .t { font: 700 13px var(--display-font); color: var(--text); }
  .hud .mid .s { font-size: 11px; color: var(--muted); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--deep); border: 1px solid var(--line); font-size: 12px; font-weight: 700; }
  .chip.red { color: #ff7a6a; border-color: #6a2a2a; }
  .chip.ok { color: var(--accent); }

  /* shop icon buttons */
  .shops { display: flex; gap: 8px; }
  .shop { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 5px; background: var(--panel-2); border: 2px solid var(--line); border-radius: 10px; color: var(--text); font-size: 11px; font-weight: 700; }
  .shop img { width: 30px; height: 30px; }
  .A-bar .shops { flex: none; gap: 6px; }
  .A-bar .shop { flex: none; width: 52px; padding: 4px 0 3px; font-size: 10px; }
  .A-bar .shop img { width: 24px; height: 24px; }
  .A-row { display: flex; gap: 8px; align-items: stretch; }
  .A-row .go { flex: 1; margin: 0; display: flex; }
  .A-row .go .btn { margin: 0; }

  /* ---------- A: full tower ---------- */
  .A-wrap { position: relative; padding: 10px 0 110px; overflow-x: hidden; }
  body { overflow-x: hidden; }
  .tower { width: 236px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
  .spire { height: 96px; position: relative; }
  .spire .roof { position: absolute; left: 50%; bottom: 0; width: 0; height: 0; transform: translateX(-50%); border-left: 70px solid transparent; border-right: 70px solid transparent; border-bottom: 80px solid #3a1414; filter: drop-shadow(0 -2px 0 #ff6a2a); }
  .spire .flag { position: absolute; left: 50%; bottom: 78px; width: 3px; height: 26px; background: #ccc; }
  .spire .flag::after { content: ''; position: absolute; left: 3px; top: 0; width: 18px; height: 11px; background: var(--danger); animation: wave 1.2s steps(2) infinite; }
  @keyframes wave { 50% { transform: skewY(8deg); } }
  .seg { position: relative; border-left: 4px solid var(--edge); border-right: 4px solid var(--edge); background-size: 48px 24px; }
  .crenel { height: 14px; margin: 0 -10px; background: linear-gradient(90deg, var(--edge) 0 18px, transparent 18px 30px) repeat-x; background-size: 30px 14px; border-bottom: 6px solid var(--edge); position: relative; }
  .seg-name { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); white-space: nowrap; font: 700 11px var(--display-font); color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 6px; z-index: 2; letter-spacing: .5px; }
  .floors { display: flex; flex-direction: column-reverse; padding: 40px 0 6px; }
  .fl { height: 44px; display: flex; align-items: center; position: relative; }
  .fl:nth-child(even) { flex-direction: row-reverse; }
  .win { width: 34px; height: 36px; margin: 0 22px; border-radius: 17px 17px 3px 3px; background: #07070f; border: 3px solid rgba(0,0,0,.6); box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); position: relative; display: grid; place-items: end center; padding: 0; cursor: pointer; }
  .win.lit { background: radial-gradient(circle at 50% 70%, #ffe680, #ffb02e 55%, #b8661c); box-shadow: 0 0 12px rgba(255,190,60,.55); }
  .win.next { background: radial-gradient(circle at 50% 70%, #3a4a8a, #141a3a); border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,201,74,.35), 0 0 16px rgba(255,201,74,.6); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgba(255,201,74,.15), 0 0 22px rgba(255,201,74,.8); } }
  .win.next img { width: 26px; height: auto; margin-bottom: 1px; }
  .plaque { font: 700 12px var(--display-font); color: rgba(255,255,255,.75); text-shadow: 0 1px 0 #000; min-width: 22px; text-align: center; }
  .fl .stair { flex: 1; height: 4px; margin-top: 30px; background: repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 6px, transparent 6px 10px); opacity: .7; }
  .fl.boss { height: 92px; justify-content: center !important; flex-direction: column !important; }
  .balcony { position: relative; width: 120px; height: 64px; border-radius: 60px 60px 4px 4px; background: radial-gradient(circle at 50% 80%, var(--aura), #0a0a14 70%); border: 4px solid rgba(0,0,0,.6); display: grid; place-items: end center; cursor: pointer; }
  .balcony img { width: 72px; margin-bottom: -4px; filter: drop-shadow(0 0 6px var(--aura)); }
  .balcony.dead img { filter: grayscale(1) brightness(.5); }
  .balcony.dead::after { content: 'DEFEATED'; position: absolute; top: 24px; font: 700 10px var(--display-font); color: var(--accent); background: rgba(0,0,0,.7); padding: 1px 6px; border-radius: 4px; }
  .ledge { width: 150px; height: 8px; background: var(--edge); border-radius: 2px; margin-top: -2px; }
  .seg.locked .floors, .seg.locked .crenel { filter: brightness(.35) saturate(.3); }
  .seg.locked .floors { height: 120px; overflow: hidden; }
  .seg .fog { display: none; }
  .seg.locked .fog { display: flex; position: absolute; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: linear-gradient(transparent, rgba(10,10,30,.75) 30%, rgba(10,10,30,.75) 70%, transparent); color: var(--text); font-size: 12px; z-index: 3; }
  .seg.locked .fog canvas { width: 36px; height: 36px; }
  .ground { height: 46px; margin: 0 -60px; background: linear-gradient(#2e4a22 0 8px, #3a2a1a 8px); border-top: 2px solid #4a7a32; display: flex; justify-content: center; }
  .door { width: 46px; height: 54px; margin-top: -54px; background: #3a2412; border: 4px solid #1a0e06; border-radius: 23px 23px 0 0; }
  .A-bar { position: fixed; left: 0; right: 0; bottom: var(--tabbar-h, 0); bottom: 0; z-index: 15; padding: 10px 12px 14px; background: linear-gradient(transparent, var(--bg) 22%); max-width: 420px; margin: 0 auto; }
  .A-bar .go { margin-top: 8px; }

  /* ---------- B: one section at a time ---------- */
  .B-card { margin: 0 12px; border: 3px solid var(--edge); border-radius: 14px; overflow: hidden; background-size: 48px 24px; }
  .B-top { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px; background: rgba(0,0,0,.45); }
  .B-top button { width: 34px; height: 34px; border-radius: 8px; border: 2px solid rgba(255,255,255,.2); background: rgba(0,0,0,.4); color: #fff; font-size: 18px; }
  .B-top button:disabled { opacity: .25; }
  .B-top .nm { text-align: center; }
  .B-top .nm b { display: block; font: 700 16px var(--display-font); color: #fff; }
  .B-top .nm span { font-size: 11px; color: rgba(255,255,255,.7); }
  .B-dots { display: flex; gap: 4px; justify-content: center; padding: 6px 0 0; }
  .B-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.25); }
  .B-dots i.on { background: var(--gold); }
  .B-boss { display: flex; flex-direction: column; align-items: center; padding: 8px 0 2px; }
  .B-steps { display: flex; flex-direction: column-reverse; gap: 6px; padding: 8px 14px 14px; }
  .step { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 8px; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.08); color: rgba(255,255,255,.55); font-weight: 700; font-size: 13px; width: calc(52% + var(--i) * 4.8%); }
  .step:nth-child(odd) { align-self: flex-start; } .step:nth-child(even) { align-self: flex-end; }
  .step { align-self: center !important; }
  .step.done { color: #fff; background: rgba(31,138,92,.55); border-color: rgba(62,224,160,.5); }
  .step.next { color: #fff; background: rgba(255,201,74,.18); border-color: var(--gold); box-shadow: 0 0 12px rgba(255,201,74,.4); }
  .step img { width: 22px; }
  .step .r { margin-left: auto; font-size: 12px; }
  .B-lock { text-align: center; padding: 34px 10px 40px; color: #fff; background: rgba(0,0,0,.55); }
  .B-lock canvas { width: 44px; height: 44px; }
  .B-foot { margin: 12px; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- C: camp ---------- */
  .C-scene { margin: 10px 12px; height: 300px; border-radius: 14px; border: 2px solid var(--line); position: relative; overflow: hidden; background: linear-gradient(#141a44, #2a2050 60%, #3a2a3a); }
  .C-scene .stars { position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 20% 20%, #fff, transparent), radial-gradient(1px 1px at 70% 12%, #fff, transparent), radial-gradient(1px 1px at 85% 40%, #fff, transparent), radial-gradient(1px 1px at 35% 45%, #ccd, transparent), radial-gradient(1px 1px at 55% 30%, #fff, transparent); }
  .C-tower { position: absolute; left: 22px; bottom: 34px; width: 74px; display: flex; flex-direction: column-reverse; }
  .C-tower .sg { height: 44px; border: 2px solid rgba(0,0,0,.5); border-bottom: none; background-size: 24px 12px; position: relative; }
  .C-tower .sg .fill { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(255,201,74,.35); box-shadow: inset 0 0 8px rgba(255,201,74,.5); }
  .C-tower .sg.locked { filter: brightness(.35) saturate(.3); }
  .C-tower .cap { height: 0; border-left: 37px solid transparent; border-right: 37px solid transparent; border-bottom: 34px solid #3a1414; }
  .C-tower .you { position: absolute; right: -16px; width: 14px; height: 4px; background: var(--gold); }
  .C-tower .you::after { content: ''; position: absolute; right: -6px; top: -4px; border: 6px solid transparent; border-left-color: var(--gold); transform: rotate(180deg); right: 14px; }
  .C-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: linear-gradient(#2e4a22 0 6px, #2a1e14 6px); }
  .C-fire { position: absolute; right: 54px; bottom: 30px; width: 30px; height: 30px; }
  .C-hero { position: absolute; right: 92px; bottom: 30px; width: 44px; }
  .C-next { position: absolute; right: 12px; top: 14px; left: 118px; text-align: right; }
  .C-next .k { font-size: 11px; color: var(--muted); }
  .C-next .f { font: 700 26px var(--display-font); color: var(--gold); line-height: 1.1; }
  .C-next .sn { font-size: 12px; color: var(--text); }
  .C-next img { width: 64px; margin-top: 6px; }
  .C-grid { margin: 0 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .C-grid .shop { flex-direction: row; justify-content: center; gap: 8px; padding: 10px; font-size: 13px; }
  .C-grid .shop img { width: 26px; height: 26px; }
  .sheet { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: none; }
  .sheet.on { display: block; }
  .sheet .in { position: absolute; left: 0; right: 0; bottom: 0; top: 40px; max-width: 420px; margin: 0 auto; background: var(--bg); border-radius: 16px 16px 0 0; overflow: auto; border-top: 2px solid var(--line); }
  .sheet .x { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg); font: 700 15px var(--display-font); color: var(--gold); }
</style>
</head>
<body>
<div class="picker">
  <div class="row">
    <button data-v="A" class="on">A · Tower</button>
    <button data-v="B">B · One section</button>
    <button data-v="C">C · Camp</button>
  </div>
  <div class="sim">Pretend you've reached floor <b id="fl-lbl">14</b><input type="range" min="1" max="50" value="14" id="fl"></div>
</div>
<main id="out"></main>
<div class="sheet" id="sheet"><div class="in"><div class="x">The Tower <button class="btn" id="sheet-x">Close</button></div><div id="sheet-body"></div></div></div>

<script type="module">
import { SECTIONS, FAMILIES } from '../js/dungeon/ddata.js';
import { enemyIcon, BOSS_AURA } from '../js/dungeon/dart.js';
import { avatarDataUrl } from '../js/sprites2.js';
import { uiIcon } from '../js/uiicons.js';

// --- tiny pixel icons for the shop buttons (dev only) ---
const MINI = {
  anvil: { pal: { a: '#8a92a8', b: '#4a5068', c: '#c4c9d6', d: '#ff8a2e' }, rows: [
    '................', '................', '................', '.....d..........', '....ddd.........', '.cccccccccccccc.', 'aaaaaaaaaaaaaaa.',
    '.aaaaaaaaaaaaa..', '....aaaaaaa.....', '.....aaaaa......', '.....aaaaa......', '....bbbbbbb.....', '...bbbbbbbbb....', '................', '................', '................'] },
  potion: { pal: { a: '#e8435a', b: '#8a1a2a', c: '#ffb0b8', d: '#c8a060', e: '#c4c9d6' }, rows: [
    '................', '......dddd......', '......eeee......', '.......ee.......', '.......ee.......', '.....eaaae......', '....eaaaaae.....', '...eaacaaaae....',
    '...eacaaaaae....', '...eaaaaaaae....', '...eaaaaaabe....', '....eabbbbe.....', '.....eeeee......', '................', '................', '................'] },
  map: { pal: { a: '#f4e6c0', b: '#c8a060', c: '#e8435a', d: '#8a6a3a' }, rows: [
    '................', '................', '..bbbbbbbbbbbb..', '..baaaaaaaaaab..', '..baadaaaaaaab..', '..baaadaaaaaab..', '..baaaadaaaaab..', '..baaaaadddaab..',
    '..baaaaaaaadab..', '..baaaaaaaacab..', '..baaaaaaaaaab..', '..bbbbbbbbbbbb..', '................', '................', '................', '................'] },
};
function mini(id, scale = 3) {
  const d = MINI[id]; const c = document.createElement('canvas'); c.width = c.height = 16 * scale; c.className = 'px';
  const x = c.getContext('2d');
  d.rows.forEach((r, y) => [...r].forEach((ch, i) => { if (d.pal[ch]) { x.fillStyle = d.pal[ch]; x.fillRect(i * scale, y * scale, scale, scale); } }));
  return c.toDataURL();
}
const ICON = { gear: uiIcon('swords', 'color', 3), smith: mini('anvil'), potions: mini('potion'), map: mini('map'), lock: uiIcon('lock', 'color', 3), flame: uiIcon('flame', 'color', 3) };
const img = (src, cls = 'px') => `<img class="${cls}" src="${src}" alt="">`;

// --- brick textures per section ---
const PAL = [
  { base: '#5a6a3a', dark: '#3e4a28', light: '#76884a', mortar: '#262c16', edge: '#2a3218' },  // goblin: mossy
  { base: '#4c4062', dark: '#342a46', light: '#665a80', mortar: '#1c1628', edge: '#221a30' },  // crypt: purple
  { base: '#66666e', dark: '#48484e', light: '#86868e', mortar: '#26262c', edge: '#2e2e34' },  // stone: grey
  { base: '#6c9cc2', dark: '#4a769c', light: '#a8d0ee', mortar: '#2a4a6a', edge: '#2e4e6e' },  // frozen: ice
  { base: '#5e2620', dark: '#401814', light: '#82362a', mortar: '#ff6a2a', edge: '#2a0e0a' },  // infernal: lava mortar
];
function bricks(p) {
  const c = document.createElement('canvas'); c.width = 16; c.height = 8; const x = c.getContext('2d');
  x.fillStyle = p.mortar; x.fillRect(0, 0, 16, 8);
  const brick = (bx, by, w) => { x.fillStyle = p.base; x.fillRect(bx, by, w, 3); x.fillStyle = p.light; x.fillRect(bx, by, w, 1); x.fillStyle = p.dark; x.fillRect(bx, by + 2, w, 1); };
  brick(0, 0, 7); brick(8, 0, 7); brick(-4, 4, 7); brick(4, 4, 7); brick(12, 4, 7);
  return c.toDataURL();
}
const TEX = PAL.map(bricks);
const segStyle = (k) => `--edge:${PAL[k].edge};background-image:url(${TEX[k]});image-rendering:pixelated;--aura:${BOSS_AURA[SECTIONS[k].boss]}`;

const hero = avatarDataUrl({}, 3);

// --- mock state from the slider ---
let reached = 14, view = 'A', bSec = null;
function mock() {
  const sec = Math.ceil(reached / 10);
  const level = SECTIONS[sec - 1].crypts + Math.floor(((reached - 1) % 10) / 3);   // rough, just for the preview
  return { reached, sec, level, unlocked: (k) => k <= sec, pct: 35, power: 324 + (reached - 1) * 40, rec: [516, 1150, 2600, 5800, 12900][sec - 1] };
}

function hud(m) {
  const low = m.power < m.rec * 0.8;
  return `<div class="hud">
    <div class="lv" style="--p:${m.pct}%"><b>${m.level}</b></div>
    <div class="mid"><div class="t">Crypts level ${m.level}</div><div class="s">${m.pct}% to level ${m.level + 1}</div></div>
    <span class="chip ${low ? 'red' : 'ok'}" title="Your power vs the boss">⚔ ${m.power} <span style="opacity:.6">/ ${m.rec}</span></span>
  </div>`;
}
const shops = (withMap) => `<div class="shops">
  ${withMap ? `<button class="shop" data-map>${img(ICON.map)}Map</button>` : ''}
  <button class="shop">${img(ICON.gear)}Gear</button>
  <button class="shop">${img(ICON.smith)}Smith</button>
  <button class="shop">${img(ICON.potions)}Potions</button></div>`;
const goBtn = (m) => {
  const f = m.reached, boss = f % 10 === 0;
  return `<button class="btn primary wide go">${boss ? `Fight the ${FAMILIES[SECTIONS[m.sec - 1].family].name} boss` : `Climb floor ${f}`}</button>`;
};

// ---------- A: the full tower ----------
function tower(m) {
  const segs = SECTIONS.map((s, k) => {
    const id = k + 1, locked = !m.unlocked(id);
    const fl = Array.from({ length: 10 }, (_, i) => {
      const f = k * 10 + i + 1;
      if (i === 9) return `<div class="fl boss"><div class="balcony ${f < m.reached ? 'dead' : ''}">${img(enemyIcon(s.boss, 4))}</div><div class="ledge"></div></div>`;
      const cls = f < m.reached ? 'lit' : f === m.reached ? 'next' : '';
      return `<div class="fl"><button class="win ${cls}" ${f === m.reached ? 'id="here"' : ''}>${f === m.reached ? img(hero) : ''}</button><span class="plaque">${f}</span><span class="stair"></span></div>`;
    }).join('');
    return `<div class="seg ${locked ? 'locked' : ''}" style="${segStyle(k)}">
      <div class="crenel"></div><div class="seg-name">${id}. ${s.name}</div>
      <div class="floors">${fl}</div>
      <div class="fog">${img(ICON.lock)}<b>${s.name}</b><span class="muted">Crypts level ${s.crypts}</span></div>
    </div>`;
  }).reverse().join('');
  return `<div class="tower"><div class="spire"><div class="flag"></div><div class="roof"></div></div>${segs}<div class="ground"><div class="door"></div></div></div>`;
}
function viewA(m) {
  return `<p class="blurb">The whole tower, drawn floor by floor. Lit windows are cleared, your character waits at the next window, and each section ends with its boss on a balcony. Tap any lit window to replay it. The action button stays pinned to the bottom.</p>
  ${hud(m)}<div class="A-wrap">${tower(m)}</div>
  <div class="A-bar"><div class="A-row">${shops(false)}<div class="go">${goBtn(m)}</div></div></div>`;
}

// ---------- B: one section at a time ----------
function viewB(m) {
  const k = (bSec ?? m.sec) - 1, s = SECTIONS[k], id = k + 1, locked = !m.unlocked(id);
  const steps = Array.from({ length: 10 }, (_, i) => {
    const f = k * 10 + i + 1, boss = i === 9;
    const cls = f < m.reached ? 'done' : f === m.reached ? 'next' : '';
    const right = f < m.reached ? '✓' : f === m.reached ? img(hero) : '';
    return `<button class="step ${cls}" style="--i:${9 - i}">${boss ? img(enemyIcon(s.boss, 2)) : ''}${boss ? 'Boss' : `Floor ${f}`}<span class="r">${right}</span></button>`;
  }).join('');
  return `<p class="blurb">One section on screen at a time, like a level-select. Swipe or tap the arrows to look at other sections. The steps narrow as they climb to the boss at the top.</p>
  ${hud(m)}
  <div class="B-card" style="${segStyle(k)}">
    <div class="B-top"><button data-b="-1" ${k === 0 ? 'disabled' : ''}>‹</button>
      <div class="nm"><b>${s.name}</b><span>Floors ${k * 10 + 1}–${id * 10} · ${FAMILIES[s.family].name}s</span></div>
      <button data-b="1" ${k === 4 ? 'disabled' : ''}>›</button></div>
    <div class="B-dots">${SECTIONS.map((_, j) => `<i class="${j === k ? 'on' : ''}"></i>`).join('')}</div>
    ${locked ? `<div class="B-lock">${img(ICON.lock)}<h3 style="margin:6px 0 2px">Locked</h3><div class="muted small">Reach Crypts level ${s.crypts} to enter</div><div style="margin-top:14px">${img(enemyIcon(s.boss, 4), 'px')}</div></div>`
      : `<div class="B-steps">${steps}</div>`}
  </div>
  <div class="B-foot">${goBtn(m)}${shops(false)}</div>`;
}

// ---------- C: camp ----------
function viewC(m) {
  const segs = SECTIONS.map((s, k) => {
    const id = k + 1, fillPct = Math.max(0, Math.min(10, m.reached - 1 - k * 10)) * 10;
    return `<div class="sg ${m.unlocked(id) ? '' : 'locked'}" style="${segStyle(k)};background-size:24px 12px">${m.unlocked(id) ? `<div class="fill" style="height:${fillPct}%"></div>` : ''}</div>`;
  }).join('');
  const youBottom = (m.reached - 0.5) / 50 * 220;
  const s = SECTIONS[m.sec - 1];
  return `<p class="blurb">The calmest screen: your camp at the foot of the tower. Just what's next and one button. The full floor map opens from "Map" when you want to replay floors.</p>
  ${hud(m)}
  <div class="C-scene"><div class="stars"></div>
    <div class="C-tower">${segs}<div class="cap"></div><div class="you" style="bottom:${youBottom}px"></div></div>
    <div class="C-ground"></div>
    ${img(hero, 'px C-hero')}${img(ICON.flame, 'px C-fire')}
    <div class="C-next"><div class="k">Next up</div><div class="f">Floor ${m.reached}</div><div class="sn">${s.name}</div>
      ${img(enemyIcon(m.reached % 10 === 0 ? s.boss : s.boss, 3))}<div class="k">${m.reached % 10 === 0 ? 'Boss fight!' : `Boss on floor ${m.sec * 10}`}</div></div>
  </div>
  <div style="margin:0 12px 10px">${goBtn(m)}</div>
  <div class="C-grid">
    <button class="shop" data-map>${img(ICON.map)}Map</button>
    <button class="shop">${img(ICON.gear)}Gear</button>
    <button class="shop">${img(ICON.smith)}Smith</button>
    <button class="shop">${img(ICON.potions)}Potions</button>
  </div>`;
}

function render(scroll = true) {
  const m = mock();
  out.innerHTML = view === 'A' ? viewA(m) : view === 'B' ? viewB(m) : viewC(m);
  if (view === 'A' && scroll) document.getElementById('here')?.scrollIntoView({ block: 'center' });
  if (view !== 'A') window.scrollTo(0, 0);
}
const out = document.getElementById('out');
document.querySelectorAll('.picker [data-v]').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.picker [data-v]').forEach((x) => x.classList.toggle('on', x === b)); view = b.dataset.v; bSec = null; render();
});
document.getElementById('fl').oninput = (e) => { reached = +e.target.value; document.getElementById('fl-lbl').textContent = reached; bSec = null; render(); };
out.addEventListener('click', (e) => {
  const b = e.target.closest('[data-b]'); if (b) { bSec = (bSec ?? mock().sec) + +b.dataset.b; render(); }
  if (e.target.closest('[data-map]')) { document.getElementById('sheet-body').innerHTML = `<div class="A-wrap" style="padding-bottom:30px">${tower(mock())}</div>`; document.getElementById('sheet').classList.add('on'); document.querySelector('#sheet #here')?.scrollIntoView({ block: 'center' }); }
});
document.getElementById('sheet-x').onclick = () => document.getElementById('sheet').classList.remove('on');
render();
</script>
</body>
</html>
