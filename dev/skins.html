<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look trials</title>
<!-- Dev-only page: the real game in a phone frame, with trial skins from dev/skins/. Not deployed. -->
<style>
  body { margin: 0; background: #101014; color: #ddd; font: 14px system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; }
  .bar { position: sticky; top: 0; z-index: 2; width: 100%; background: #101014; padding: 10px 8px 8px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; border-bottom: 1px solid #333; }
  .bar button { padding: 8px 12px; border-radius: 8px; border: 1px solid #444; background: #1c1c22; color: #ddd; font-weight: 600; cursor: pointer; }
  .bar button.on { border-color: #ffc94a; color: #ffc94a; background: #2a2410; }
  .about { max-width: 420px; text-align: center; color: #999; padding: 6px 14px 0; min-height: 36px; }
  .phone { margin: 10px 0 24px; width: 390px; max-width: 100vw; height: 800px; max-height: calc(100vh - 130px); border: 10px solid #000; border-radius: 34px; overflow: hidden; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7); }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  @media (max-width: 440px) { .phone { border: 0; border-radius: 0; height: calc(100vh - 120px); max-height: none; margin: 0; } }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="about" id="about"></div>
<div class="phone"><iframe id="game" title="Life RPG"></iframe></div>
<script>
  const SKINS = [
    ['', 'Current', 'What the game looks like now (Royal Arcane).'],
    ['astral', 'Astral Grimoire', 'Twinkling starry sky and nebula, glass panels with gold filigree corners, violet magic glow. Fancy Cinzel Decorative titles, book-style text.'],
    ['ember', 'Ember Runes', 'Obsidian stone slabs with a molten edge and glowing runes, embers drifting up the screen. Old Celtic-style title font.'],
    ['grove', 'Moonlit Grove', 'Fae forest at night: moon glow, emerald mist, blinking fireflies, soft rounded silver-edged panels.'],
    ['pixel', 'Pixel Arcana', 'Goes all-in on the pixel art: chunky stepped pixel frames, pixel fonts, square sparkles and faint retro scanlines.'],
  ];
  const bar = document.getElementById('bar'), game = document.getElementById('game'), about = document.getElementById('about');
  function pick(id) {
    game.src = '../index.html' + (id ? '?skin=' + id : '');
    [...bar.children].forEach((b) => b.classList.toggle('on', b.dataset.id === id));
    about.textContent = SKINS.find((s) => s[0] === id)[2] + ' Tap around inside the phone to see every tab.';
  }
  for (const [id, name] of SKINS) { const b = document.createElement('button'); b.textContent = name; b.dataset.id = id; b.onclick = () => pick(id); bar.appendChild(b); }
  pick('astral');
</script>
</body>
</html>
